name: Build & Release

# Push to main: build, and create release v<version> if package.json carries a
#               version that has no release yet.
# Tag v*:       build and attach the files to that tag's release.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '18'
  CSC_IDENTITY_AUTO_DISCOVERY: 'false'

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm run check

  build:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: build:win
            files: |
              dist/*.exe
          - os: ubuntu-22.04
            script: build:linux
            files: |
              dist/*.AppImage
              dist/*.deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run ${{ matrix.script }}
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ runner.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          retention-days: 14

  release:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Pick release tag
        id: tag
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "mode=tag" >> "$GITHUB_OUTPUT"
          else
            echo "name=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
            echo "mode=main" >> "$GITHUB_OUTPUT"
          fi
      - name: Create or update release
        run: |
          TAG='${{ steps.tag.outputs.name }}'
          ls -la release
          if gh release view "$TAG" >/dev/null 2>&1; then
            if [ '${{ steps.tag.outputs.mode }}' = "main" ]; then
              echo "Release $TAG exists already; bump the version in package.json for a new one."
              exit 0
            fi
            gh release upload "$TAG" release/* --clobber
          else
            # notes: the changes of this version from CHANGELOG.md, then the download table
            VERSION="${TAG#v}"
            awk -v v="$VERSION" 'index($0, "## " v " ") == 1 { found = 1; next } /^## / { found = 0 } found' CHANGELOG.md > changes.md
            if [ ! -s changes.md ]; then
              echo "CHANGELOG.md has no section for $VERSION"
              exit 1
            fi
            { echo "### Changes"; cat changes.md; echo; echo "### Download"; echo; cat .github/release-notes.md; } > notes.md
            gh release create "$TAG" release/* \
              --target "$GITHUB_SHA" \
              --title "Naruto Online Launcher $TAG" \
              --notes-file notes.md
          fi
